# Usado pelo docker-compose.local.yml: a aplicação roda FORA do Docker (IntelliJ / mvn spring-boot:run)
# e o Prometheus, dentro do Docker, coleta da máquina host.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: pagamentos-app
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal = sua máquina, vista de dentro do container.
      # Funciona nativo no Docker Desktop (Windows/Mac); no Linux o compose mapeia via host-gateway.
      - targets: ["host.docker.internal:8080"]
