services:
  app:
    build: .
    container_name: pagamentos-app
    ports:
      - "8080:8080"
    environment:
      AMBIENTE: docker
      # true = gerador automático de tráfego | false = modo manual (/manual/cenarios)
      SIMULADOR_AUTOMATICO: "true"
      SIMULADOR_EPS: "40"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pagamentos-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    container_name: pagamentos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Ambiente local: anônimo pode editar e salvar dashboards sem login.
      # Em ambiente compartilhado, volte para Viewer e use o login admin.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pagamentos.json
    volumes:
      - grafana-data:/var/lib/grafana   # persiste o que for salvo pela UI
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  grafana-data:
